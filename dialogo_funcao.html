<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root { --verde:#2F5D50; --verde-claro:#E8F0ED; --erro:#B31412; --aviso:#8A6D00; }
  body { font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#202124; margin:0; padding:14px; }
  h1 { font-size:14px; color:var(--verde); margin:0 0 10px; }
  .quem { background:var(--verde-claro); border-radius:6px; padding:8px 10px; margin-bottom:10px; }
  .quem b { color:var(--verde); }
  label { display:block; font-size:12px; color:#5F6368; margin-bottom:4px; }
  select { width:100%; padding:6px; font-size:13px; box-sizing:border-box; }
  .linha { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  button { padding:7px 12px; font-size:13px; border:0; border-radius:4px; cursor:pointer; }
  button.principal { background:var(--verde); color:#fff; }
  button.secundario { background:#E8EAED; color:#202124; }
  button:disabled { opacity:.45; cursor:default; }
  .nota { font-size:11px; color:#5F6368; margin-top:8px; }
  .erro { color:var(--erro); background:#FCE8E6; border-radius:4px; padding:6px 8px; margin-top:8px; font-size:12px; }
  .avisoBox { color:var(--aviso); background:#FEF7E0; border-radius:4px; padding:6px 8px; margin-top:8px; font-size:12px; }
  .ok { color:#137333; background:#E6F4EA; border-radius:4px; padding:6px 8px; margin-top:8px; font-size:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <h1>Alocar em Função</h1>
  <div id="quem" class="quem">Lendo a célula…</div>

  <label for="funcao">Função neste serviço</label>
  <select id="funcao" disabled></select>
  <div id="nota" class="nota"></div>

  <div id="erro" class="erro" hidden></div>
  <div id="avisos" class="avisoBox" hidden></div>
  <div id="ok" class="ok" hidden></div>

  <div class="linha">
    <button id="btnFechar" class="secundario">Fechar</button>
    <button id="btnGravar" class="principal" disabled>Gravar função</button>
  </div>

<script>
  var el = function (id) { return document.getElementById(id); };
  var ctx = null;

  function mostrar(id, sim) { el(id).hidden = !sim; }
  function erro(e) {
    el('erro').textContent = (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
    mostrar('erro', true);
    el('btnGravar').disabled = false;
  }

  function desenhar(c) {
    ctx = c;
    if (!c.ok) { el('quem').textContent = c.erro; return; }
    el('quem').textContent = '';
    el('quem').appendChild(document.createTextNode(c.militar + ' · ' + c.dia + ' · '));
    var b = document.createElement('b'); b.textContent = c.rotulo; el('quem').appendChild(b);
    if (c.unidade) el('quem').appendChild(document.createTextNode(' · unidade ' + c.unidade));

    var sel = el('funcao');
    sel.innerHTML = '';
    var vazio = document.createElement('option');
    vazio.value = ''; vazio.textContent = c.atual ? '(apagar a função)' : '(sem função)';
    sel.appendChild(vazio);
    c.funcoes.forEach(function (f) {
      var o = document.createElement('option');
      o.value = f.funcao;
      o.textContent = f.funcao + (f.unidade ? ' / ' + f.unidade : '') + (f.exigeCnh ? ' · exige CNH' : '');
      sel.appendChild(o);
    });
    sel.value = c.funcoes.some(function (f) { return f.funcao === c.atual; }) ? c.atual : '';
    sel.disabled = false;
    el('btnGravar').disabled = false;
    el('nota').textContent = 'Só as funções cadastradas para ' + c.servico + ' no turno ' + c.turno +
      ' (abas ESCALAS, GUARNIÇÕES POR ESCALA e GUARNIÇÕES). A unidade e a alocação não são alteradas.' +
      (c.atual ? ' Função atual: ' + c.atual + '.' : ' Nenhuma função gravada ainda.');
    if (c.avisos && c.avisos.length) { el('avisos').textContent = c.avisos.join(' '); mostrar('avisos', true); }
  }

  el('btnFechar').addEventListener('click', function () { google.script.host.close(); });

  el('btnGravar').addEventListener('click', function () {
    if (!ctx || !ctx.ok) return;
    mostrar('erro', false); mostrar('ok', false);
    el('btnGravar').disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        var msg = r.mensagem;
        if (r.unidade) msg += ' Unidade mantida: ' + r.unidade + '.';
        if (r.perdeuUnidade) msg += ' ATENÇÃO: a unidade mudou; avise a programação.';
        el('ok').textContent = msg;
        mostrar('ok', true);
        el('btnGravar').disabled = false;
        google.script.run.withSuccessHandler(desenhar).withFailureHandler(erro).alocarEmFuncaoContexto();
      })
      .withFailureHandler(erro)
      .alocarEmFuncaoGravar(ctx.chave, el('funcao').value);
  });

  google.script.run.withSuccessHandler(desenhar).withFailureHandler(erro).alocarEmFuncaoContexto();
</script>
</body>
</html>
